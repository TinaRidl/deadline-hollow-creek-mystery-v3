<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Police Report"><rect width="900" height="520" fill="#eef0f3"/><rect x="70" y="42" width="760" height="436" rx="10" fill="#f9fbff" stroke="#b7c3d4" stroke-width="4"/><text x="111" y="101" fill="#293648" font-size="38" font-family="Arial" font-weight="700">HOLLOW CREEK POLICE DEPARTMENT</text><text x="113" y="136" fill="#63758c" font-size="20">Initial Discovery Report — Saturday, October 17, 1987</text>
        <line x1="108" y1="158" x2="793" y2="158" stroke="#cbd4df" stroke-width="3"/>
        <text x="114" y="205" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Victim:</text><text x="232" y="205" fill="#374a5d" font-size="22">Jamie Mercer, male, age 19</text>
        <text x="114" y="245" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Found by:</text><text x="232" y="245" fill="#374a5d" font-size="22">Elias Turner, local fisherman, 6:18 AM</text>
        <text x="114" y="285" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Location:</text><text x="232" y="285" fill="#374a5d" font-size="22">South bank, Blackwater Lake</text>
        <text x="114" y="325" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Initial theory:</text><text x="282" y="325" fill="#374a5d" font-size="22">Accidental drowning</text>
        <text x="114" y="365" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Irregularities:</text><text x="282" y="365" fill="#374a5d" font-size="20">stopped watch at 11:47 PM, car parked away from shore, bruising inconsistent</text>
        <text x="114" y="405" fill="#263548" font-size="23" font-family="Arial" font-weight="700">Detective goal:</text><text x="282" y="405" fill="#374a5d" font-size="20">Interview witnesses, search locations, collect clues, identify the killer</text>
        <text x="114" y="447" fill="#7c8ea2" font-size="17">Prepared for the incoming detective. Treat this case as suspicious pending investigation.</text></svg>